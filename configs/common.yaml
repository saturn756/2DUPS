# 全链路共享配置；仅数据清单和对齐政策，模块参数在各模块配置中。

project: 2DUPS
interface_version: "1.0"      # 对应 docs/interface/04_接口规范.md

# 数据清单：版本、切分、来源与许可、切片标签（DatasetManifest / I1）
dataset:
  manifest: configs/dataset_manifest.yaml
  name: BDD100K

# 对齐与版本策略
alignment:
  frame_key: frame_id
  variant_key: variant_id
  variant_policy: same_for_all_branches       # M2 决定默认版本，三条支路必须一致
  allow_future_frames: false

# 运行与日志
runtime:
  log_dir: logs
  log_level: INFO

# 评测与验证
evaluation:
  slices: [normal, low_light, blur, occlusion, far, camera_motion, calibration_missing]
  failure_tags: true
  record: EvaluationRecord                    # I9
