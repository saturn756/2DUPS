# M2 第一版：BDD100K RGB 帧质量评价与非几何增强；阈值尚需下游验证。
module: M2
name: 输入规范化、图像预处理与质量评价
producer_ref: m2.clahe_lab

impl:
  rectification: deferred           # 标定文件格式尚未接入，不能伪造 rectified
  enhancement:
    selected: clahe_lab

io:
  inputs: [CalibratedFrame]                        # I2
  outputs: [ImageVariantSet, QualityReport]        # I3

params:
  preserve_raw: true
  normalize:
    color_space: RGB
    dtype: uint8
    resize: null
  output_dir: outputs/m2
  exposure_pixels:
    under_lt: 40
    over_gt: 245
  quality_gate:
    low_light: {brightness_mean_lt: 60, underexposed_fraction_gt: 0.25}
    severe_low_light: {brightness_mean_lt: 35, underexposed_fraction_gt: 0.45}
    overexposed: {overexposed_fraction_gt: 0.03}
    blur: {laplacian_variance_lt: 80}
    noisy: {noise_sigma_gt: 8}
  lowlight:
    clahe: {clip_limit: 2.0, tile_grid_size: [8, 8]}
    gamma: {enabled: true, normal: 0.90, severe: 0.80}
  denoise:
    diameter: 5
    sigma_color: 20
    sigma_space: 5

compare_downstream: true            # 阈值只供冒烟测试，不能宣称检测/跟踪改善
