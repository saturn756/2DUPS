        ref: coco.bicycle
      2:
        name: car
        ref: coco.car
      3:
        name: motorcycle
        ref: coco.motorcycle
      5:
        name: bus
        ref: coco.bus
      7:
        name: truck
        ref: coco.truck
      9:
        name: traffic light
        ref: coco.traffic_light
      11:
        name: stop sign
        ref: coco.stop_sign
producer_ref: m2.yolo11_detector
