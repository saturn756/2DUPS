# M4 tracking-by-detection 第一版：只依赖 I5，几何补偿是可选输入。
module: M4
name: 多目标跟踪
status: initial_implementation

impl:
  association: iou_greedy
  motion_compensation: optional

io:
  inputs: [DetectionSet, MatchResult_optional]
  outputs: [TrackSet]

params:
  match_iou_threshold: 0.2
  max_lost_frames: 30
  reset_on_sequence_change: true
  use_geometry: false

producer_ref: m4.iou_tracker
