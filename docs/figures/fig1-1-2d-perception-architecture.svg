<text x="1347" y="372" font-size="12.5" fill="#C4832A" font-weight="700" text-anchor="start">2D 语义分割与场景拓扑推理</text>
<text x="1347" y="400" font-size="11" fill="#C4832A" font-weight="700" text-anchor="start">·</text>
<text x="1356" y="400" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">选定：PIDNet-S（分割）</text>
<text x="1347" y="416.5" font-size="11" fill="#C4832A" font-weight="700" text-anchor="start">·</text>
<text x="1356" y="416.5" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">规则化 2D 场景图（关系推理）</text>
