<text x="414.0" y="363.5" font-size="10.5" fill="#2F6FB0" font-weight="700" text-anchor="middle">阶段二</text>
<text x="287" y="382" font-size="13.5" fill="#2F6FB0" font-weight="700" text-anchor="start">道路图像采集与相机标定</text>
<text x="287" y="410" font-size="11" fill="#2F6FB0" font-weight="700" text-anchor="start">·</text>
<text x="296" y="410" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">选定：OpenCV Zhang 平面标定</text>
<text x="287" y="426.5" font-size="11" fill="#2F6FB0" font-weight="700" text-anchor="start">·</text>
<text x="296" y="426.5" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">棋盘格采集 + 畸变校正</text>
<text x="287" y="443.0" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">入：图像/视频、标注、相机参数</text>
<text x="287" y="459.5" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">出：DatasetManifest、CalibratedFrame</text>
<text x="287" y="476.0" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">标：重投影误差、标定可用率</text>
