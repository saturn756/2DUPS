<rect x="915" y="351" width="58" height="17" rx="8.5" fill="#2E8B6E" fill-opacity="0.16"/>
<text x="944.0" y="363.5" font-size="10.5" fill="#2E8B6E" font-weight="700" text-anchor="middle">阶段四</text>
<text x="807" y="382" font-size="13.5" fill="#2E8B6E" font-weight="700" text-anchor="start">2D 目标检测</text>
<text x="807" y="410" font-size="11" fill="#2E8B6E" font-weight="700" text-anchor="start">·</text>
<text x="816" y="410" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">选定：YOLOv12-N（官方实现）</text>
<text x="807" y="426.5" font-size="11" fill="#2E8B6E" font-weight="700" text-anchor="start">·</text>
<text x="816" y="426.5" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">备选 YOLOv12-S（精度优先）</text>
