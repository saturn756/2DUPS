<text x="1086" y="410" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">选定：ByteTrack（跟踪主选）</text>
<text x="1077" y="426.5" font-size="11" fill="#2E8B6E" font-weight="700" text-anchor="start">·</text>
<text x="1086" y="426.5" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">UCMCTrack（运动补偿升级）</text>
