<text x="1347" y="449.5" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">出：SegmentationMap、SceneGraph2D</text>
<text x="1347" y="466.0" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">标：mIoU、关系准确率、图合法率</text>
