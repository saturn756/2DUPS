<text x="807" y="459.5" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">出：DetectionSet（逐帧实例）</text>
<text x="807" y="476.0" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">标：mAP、AP-S、漏检率、帧率</text>
