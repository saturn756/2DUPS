<rect width="1900" height="890" fill="#FFFFFF"/>
<text x="40" y="50" font-size="27" fill="#12314F" font-weight="700" text-anchor="start">图 1-1  单模态 2D 感知系统六大模块架构图</text>
<text x="40" y="76" font-size="12.5" fill="#5B6B7A" font-weight="400" text-anchor="start">按经典模块化流水线组织：传感与标定 → 图像预处理 →｛特征匹配（定位）∥ 目标检测｝→ 多目标跟踪 → 语义分割与场景表示；实线为运行时数据流，虚线为可选几何依赖、质量门控反馈与评测依赖。</text>
