<rect x="915" y="131" width="58" height="17" rx="8.5" fill="#2E8B6E" fill-opacity="0.16"/>
<text x="944.0" y="143.5" font-size="10.5" fill="#2E8B6E" font-weight="700" text-anchor="middle">阶段四</text>
<text x="807" y="162" font-size="13.5" fill="#2E8B6E" font-weight="700" text-anchor="start">特征检测与局部特征匹配</text>
<text x="807" y="190" font-size="11" fill="#2E8B6E" font-weight="700" text-anchor="start">·</text>
<text x="816" y="190" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">选定：SIFT + FLANN + RANSAC</text>
<text x="807" y="206.5" font-size="11" fill="#2E8B6E" font-weight="700" text-anchor="start">·</text>
<text x="816" y="206.5" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">XFeat（学习型对照）</text>
<text x="807" y="223.0" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">入：ImageVariantSet（相邻帧图像对）</text>
<text x="807" y="239.5" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">出：MatchResult（单应矩阵 H）</text>
<text x="807" y="256.0" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">标：匹配点数、内点率、重投影误差</text>
