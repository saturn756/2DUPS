<rect x="645" y="351" width="58" height="17" rx="8.5" fill="#2F6FB0" fill-opacity="0.16"/>
<text x="674.0" y="363.5" font-size="10.5" fill="#2F6FB0" font-weight="700" text-anchor="middle">阶段三</text>
<text x="547" y="382" font-size="13.5" fill="#2F6FB0" font-weight="700" text-anchor="start">图像预处理与质量评价</text>
<text x="547" y="410" font-size="11" fill="#2F6FB0" font-weight="700" text-anchor="start">·</text>
<text x="556" y="410" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">选定：Zero-DCE Tiny（低照度）</text>
<text x="547" y="426.5" font-size="11" fill="#2F6FB0" font-weight="700" text-anchor="start">·</text>
<text x="556" y="426.5" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">CLAHE 基线；DnLUT 去噪对照</text>
<text x="547" y="443.0" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">入：CalibratedFrame</text>
<text x="547" y="459.5" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">出：ImageVariantSet、QualityReport</text>
<text x="547" y="476.0" font-size="10.5" fill="#5B6B7A" font-weight="400" text-anchor="start">标：PSNR/SSIM/NIQE + 下游指标差</text>
