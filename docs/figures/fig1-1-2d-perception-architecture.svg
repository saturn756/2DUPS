<text x="1670" y="416" font-size="10.6" fill="#5B6B7A" font-weight="400" text-anchor="start">前/后、相邻与冲突，每条边携带</text>
<text x="1670" y="431" font-size="10.6" fill="#5B6B7A" font-weight="400" text-anchor="start">evidence 与 confidence</text>
<rect x="1655" y="560" width="220" height="95" rx="12" ry="12" fill="#F1F3F6" stroke="#8794A2" stroke-width="1.8"/>
<text x="1670" y="586" font-size="13" fill="#4A5A6A" font-weight="700" text-anchor="start">EvaluationRecord</text>
