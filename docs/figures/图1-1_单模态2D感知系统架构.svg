  <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8B99"/>
</marker>
<marker id="arrowOpt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#98A5B0"/>
</marker>
<style>text { font-family: PingFang SC, Hiragino Sans GB, Heiti SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif; }</style>
</defs>
<rect width="1680" height="780" fill="#FFFFFF"/>
<text x="40" y="52" font-size="27" fill="#12314F" text-anchor="start" font-weight="700">单模态 2D 感知系统架构</text>
<text x="40" y="78" font-size="12.5" fill="#5B6B7A" text-anchor="start" font-weight="400">六个模块的功能与数据流（虚线为可选输入）</text>
<rect x="40" y="320" width="150" height="150" rx="12" fill="#F2F5F8" stroke="#6E7F8D" stroke-width="1.6"/>
<text x="54" y="350" font-size="14" fill="#3C4C5C" text-anchor="start" font-weight="700">输入源</text>
<text x="54" y="374" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">道路 RGB 图像/视频</text>
<text x="54" y="392" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">相机参数（可选）</text>
<text x="54" y="410" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">标注与真值（仅评测）</text>
<rect x="240" y="320" width="180" height="150" rx="12" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1.8"/>
<rect x="254" y="333" width="54" height="23" rx="11.5" fill="#2F6FB0"/>
<text x="281" y="349" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">M1</text>
<text x="254" y="382" font-size="15" fill="#2F6FB0" text-anchor="start" font-weight="700">采集与相机标定</text>
<text x="254" y="406" font-size="11.8" fill="#5B6B7A" text-anchor="start" font-weight="400">组织输入样本，建立统一</text>
<text x="254" y="425" font-size="11.8" fill="#5B6B7A" text-anchor="start" font-weight="400">图像坐标系与标定状态</text>
<rect x="500" y="320" width="180" height="150" rx="12" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1.8"/>
<rect x="514" y="333" width="54" height="23" rx="11.5" fill="#2F6FB0"/>
<text x="541" y="349" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">M2</text>
<text x="514" y="382" font-size="15" fill="#2F6FB0" text-anchor="start" font-weight="700">图像预处理与质量评价</text>
<text x="514" y="406" font-size="11.8" fill="#5B6B7A" text-anchor="start" font-weight="400">产出可用的图像版本，</text>
<text x="514" y="425" font-size="11.8" fill="#5B6B7A" text-anchor="start" font-weight="400">给出质量结论与门控决策</text>
<rect x="800" y="105" width="220" height="125" rx="12" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1.8"/>
<rect x="814" y="118" width="54" height="23" rx="11.5" fill="#2F6FB0"/>
<text x="841" y="134" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">M3</text>
<text x="814" y="167" font-size="15" fill="#2F6FB0" text-anchor="start" font-weight="700">几何特征提取与自运动估计</text>
<text x="814" y="191" font-size="11.8" fill="#5B6B7A" text-anchor="start" font-weight="400">由图像对估计帧间几何变换与</text>
<text x="814" y="210" font-size="11.8" fill="#5B6B7A" text-anchor="start" font-weight="400">自车运动，输出几何可信度</text>
<rect x="800" y="290" width="220" height="210" rx="12" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1.8"/>
<rect x="814" y="303" width="54" height="23" rx="11.5" fill="#2F6FB0"/>
<text x="841" y="319" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">M4</text>
<text x="814" y="352" font-size="15" fill="#2F6FB0" text-anchor="start" font-weight="700">多目标检测与跟踪</text>
<text x="814" y="376" font-size="11.8" fill="#5B6B7A" text-anchor="start" font-weight="400">① 检测：逐帧给出实例级目标</text>
<text x="814" y="395" font-size="11.8" fill="#5B6B7A" text-anchor="start" font-weight="400">　　（类别、位置、置信度）</text>
<text x="814" y="414" font-size="11.8" fill="#5B6B7A" text-anchor="start" font-weight="400">② 跟踪：跨帧关联，输出带身份</text>
<text x="814" y="433" font-size="11.8" fill="#5B6B7A" text-anchor="start" font-weight="400">　　与状态的轨迹</text>
<rect x="800" y="560" width="220" height="125" rx="12" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1.8"/>
<rect x="814" y="573" width="54" height="23" rx="11.5" fill="#2F6FB0"/>
<text x="841" y="589" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">M5</text>
<text x="814" y="622" font-size="15" fill="#2F6FB0" text-anchor="start" font-weight="700">语义分割</text>
<text x="814" y="646" font-size="11.8" fill="#5B6B7A" text-anchor="start" font-weight="400">输出像素级区域结构（道路、</text>
<text x="814" y="665" font-size="11.8" fill="#5B6B7A" text-anchor="start" font-weight="400">可行驶区域、车道标线等）</text>
<rect x="1120" y="290" width="240" height="210" rx="12" fill="#EAF2FB" stroke="#2F6FB0" stroke-width="1.8"/>
<rect x="1134" y="303" width="54" height="23" rx="11.5" fill="#2F6FB0"/>
<text x="1161" y="319" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">M6</text>
<text x="1134" y="352" font-size="15" fill="#2F6FB0" text-anchor="start" font-weight="700">场景理解与拓扑推理</text>
<text x="1134" y="376" font-size="11.8" fill="#5B6B7A" text-anchor="start" font-weight="400">融合轨迹、区域与几何证据，</text>
<text x="1134" y="395" font-size="11.8" fill="#5B6B7A" text-anchor="start" font-weight="400">输出对象—区域关系图</text>
<text x="1134" y="414" font-size="11.8" fill="#5B6B7A" text-anchor="start" font-weight="400">（关系类型 + 证据 + 置信度）</text>
<rect x="1440" y="330" width="190" height="130" rx="12" fill="#F2F5F8" stroke="#6E7F8D" stroke-width="1.6"/>
<text x="1454" y="360" font-size="14" fill="#3C4C5C" text-anchor="start" font-weight="700">结构化场景描述</text>
<text x="1454" y="384" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">SceneGraph2D：</text>
<text x="1454" y="402" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">节点（对象/区域/轨迹）</text>
<text x="1454" y="420" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">关系 + 证据 + 置信度</text>
