<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#61788A"/></marker>
  <marker id="optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9A8BB0"/></marker>
  <style>
    text { font-family: PingFang SC, Hiragino Sans GB, Heiti SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif; }
    .title { font-size: 32px; font-weight: 700; fill: #173A59; }
    .sub { font-size: 15px; fill: #617483; }
    .group { font-size: 16px; font-weight: 700; fill: #526B7B; }
    .tag { font-size: 14px; font-weight: 700; fill: #FFF; }
    .head { font-size: 20px; font-weight: 700; fill: #1D5F96; }
    .copy { font-size: 14px; fill: #526977; }
    .small { font-size: 12px; fill: #70828D; }
    .iface { font-size: 13px; fill: #516D7C; }
    .metric { font-size: 13px; fill: #526875; }
  </style>
</defs>
<rect width="1800" height="980" fill="#FFF"/>
<text x="58" y="58" class="title">2DUPS 主架构：M0 数据接入 → M5 系统集成</text>
<text x="58" y="88" class="sub">以统一接口连接数据、预处理、检测、分割和跟踪；E 评测层贯穿全部模块</text>

<!-- zones -->
<rect x="38" y="130" width="270" height="680" rx="18" fill="#F7F9FA" stroke="#D4DEE4"/>
<rect x="330" y="130" width="270" height="680" rx="18" fill="#F4F8FC" stroke="#CFE0EB"/>
<rect x="622" y="130" width="850" height="680" rx="18" fill="#F8FBFD" stroke="#CFE0EB"/>
<rect x="1494" y="130" width="268" height="680" rx="18" fill="#FBF8FD" stroke="#DED3EA"/>
<text x="62" y="171" class="group">A · 数据接入</text>
<text x="354" y="171" class="group">B · 图像处理</text>
<text x="646" y="171" class="group">C · 2D 感知支路</text>
<text x="1518" y="171" class="group">D · 系统输出</text>

<!-- input -->
<rect x="62" y="250" width="222" height="190" rx="14" fill="#FFF" stroke="#8297A4" stroke-width="2"/>
<text x="84" y="289" font-size="19" font-weight="700" fill="#3C5667">外部输入</text>
<text x="84" y="326" class="copy">视频 / 图像序列</text>
<text x="84" y="351" class="copy">数据集标注</text>
<text x="84" y="376" class="copy">可选标定文件</text>
<text x="84" y="409" class="small">数据来源和许可进入 I1</text>

<!-- M0 -->
<rect x="62" y="520" width="222" height="205" rx="14" fill="#EAF3FC" stroke="#3980B9" stroke-width="2"/>
<rect x="84" y="544" width="58" height="28" rx="14" fill="#3980B9"/><text x="113" y="564" text-anchor="middle" class="tag">M0</text>
<text x="84" y="607" class="head">数据接入</text><text x="84" y="633" class="head">与标准化</text>
<text x="84" y="670" class="copy">适配器 → I1 / I2</text>
<text x="84" y="695" class="copy">帧号、时间戳、坐标</text>

<!-- M1 -->
<rect x="354" y="300" width="222" height="260" rx="14" fill="#EAF3FC" stroke="#3980B9" stroke-width="2"/>
<rect x="376" y="324" width="58" height="28" rx="14" fill="#3980B9"/><text x="405" y="344" text-anchor="middle" class="tag">M1</text>
<text x="376" y="387" class="head">图像预处理</text><text x="376" y="413" class="head">与质量评价</text>
<text x="376" y="451" class="copy">RGB / 尺寸 / 质量检查</text>
<text x="376" y="476" class="copy">去噪、低照度增强</text>
<text x="376" y="510" class="copy">raw 保留，输出 I3</text>
<text x="376" y="538" class="small">一次运行固定 default_variant</text>

<!-- branch cards -->
<rect x="654" y="225" width="380" height="185" rx="14" fill="#EEF7FE" stroke="#3980B9" stroke-width="2"/>
<rect x="676" y="249" width="58" height="28" rx="14" fill="#3980B9"/><text x="705" y="269" text-anchor="middle" class="tag">M2</text>
<text x="676" y="312" class="head">目标检测</text>
<text x="676" y="347" class="copy">全图逐帧 → DetectionSet (I5)</text>
<text x="676" y="375" class="small">车辆、行人、交通标志、交通灯</text>

<rect x="654" y="455" width="380" height="185" rx="14" fill="#EEF7FE" stroke="#3980B9" stroke-width="2"/>
<rect x="676" y="479" width="58" height="28" rx="14" fill="#3980B9"/><text x="705" y="499" text-anchor="middle" class="tag">M3</text>
<text x="676" y="542" class="head">语义 / 车道分割</text>
<text x="676" y="577" class="copy">可行驶区域、道路、车道线 → I7</text>
<text x="676" y="605" class="small">输出映射回源帧坐标</text>

<rect x="1070" y="225" width="380" height="185" rx="14" fill="#EEF7FE" stroke="#3980B9" stroke-width="2"/>
<rect x="1092" y="249" width="58" height="28" rx="14" fill="#3980B9"/><text x="1121" y="269" text-anchor="middle" class="tag">M4</text>
<text x="1092" y="312" class="head">多目标跟踪</text>
<text x="1092" y="347" class="copy">连续 I5 → TrackSet (I6)</text>
<text x="1092" y="375" class="small">IoU 关联，维护跨帧 Track ID</text>

<rect x="1070" y="455" width="380" height="185" rx="14" fill="#EEF7FE" stroke="#3980B9" stroke-width="2"/>
<rect x="1092" y="479" width="58" height="28" rx="14" fill="#3980B9"/><text x="1121" y="499" text-anchor="middle" class="tag">M5</text>
<text x="1092" y="542" class="head">系统集成</text>
<text x="1092" y="577" class="copy">I5 + I6 + I7 → SceneGraph2D (I8)</text>
<text x="1092" y="605" class="small">证据约束的 2D 关系和可视化</text>

<!-- output -->
<rect x="1520" y="300" width="216" height="240" rx="14" fill="#F3ECFB" stroke="#7961A5" stroke-width="2"/>
<text x="1544" y="344" font-size="20" font-weight="700" fill="#674B97">场景输出</text>
<text x="1544" y="383" class="copy">检测框、掩码、Track ID</text>
<text x="1544" y="410" class="copy">2D 区域关系</text>
<text x="1544" y="437" class="copy">可视化视频</text>
<line x1="1544" y1="462" x2="1712" y2="462" stroke="#CBBBDD"/>
<text x="1544" y="493" class="small">不输出深度、距离、TTC</text>
<text x="1544" y="516" class="small">或自动驾驶控制结论</text>

<!-- required flows -->
<path d="M173 440V520" fill="none" stroke="#61788A" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="186" y="486" class="iface">原始数据</text>
<path d="M284 622H320V430H354" fill="none" stroke="#61788A" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="294" y="604" class="iface">I2</text>
<path d="M576 430H620V318H654" fill="none" stroke="#61788A" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M620 430V548H654" fill="none" stroke="#61788A" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M1034 318H1070" fill="none" stroke="#61788A" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M1034 548H1070" fill="none" stroke="#61788A" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="582" y="410" class="iface">I3 同一版本</text>
<text x="1038" y="305" class="iface">I5</text>
<text x="1038" y="538" class="iface">I7</text>
<path d="M1260 410V455" fill="none" stroke="#61788A" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1274" y="440" class="iface">I6</text>
<path d="M1450 548H1484V420H1520" fill="none" stroke="#61788A" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M1628 540V610" fill="none" stroke="#61788A" stroke-width="2.4" marker-end="url(#arrow)"/>

<!-- optional geometry -->
<rect x="654" y="685" width="796" height="75" rx="12" fill="#F8F5FB" stroke="#B8A8CB" stroke-dasharray="7 5"/>
<text x="678" y="714" font-size="15" font-weight="700" fill="#735E9A">可选扩展：帧间几何 / MatchResult (I4)</text>
<text x="678" y="740" class="small">只做图像平面运动补偿，可供 M4；缺失或失败不阻塞主链路</text>
<path d="M1050 685V640" fill="none" stroke="#9A8BB0" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#optional)"/>

<!-- alignment bus -->
<rect x="62" y="840" width="1674" height="58" rx="13" fill="#183D5B"/>
<text x="88" y="876" font-size="15" font-weight="700" fill="#FFF">统一对齐与追溯</text>
<text x="300" y="876" font-size="14" fill="#D4E2EA">sequence_id · frame_id · variant_id · coordinate_space · producer_ref · config_ref</text>

<!-- evaluation -->
<rect x="38" y="920" width="1724" height="42" rx="10" fill="#F1F4F6" stroke="#C8D2D9"/>
<text x="62" y="947" font-size="15" font-weight="700" fill="#526875">E 评测层</text>
<text x="190" y="947" class="metric">M0 接入</text><text x="290" y="947" class="metric">M1 质量</text><text x="390" y="947" class="metric">M2 mAP</text><text x="490" y="947" class="metric">M3 mIoU / Lane F1</text><text x="700" y="947" class="metric">M4 MOTA / IDF1</text><text x="900" y="947" class="metric">M5 关系与降级</text><text x="1160" y="947" class="metric">→ I9 EvaluationRecord</text>
</svg>
