<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="830" viewBox="0 0 1700 830">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8B99"/>
</marker>
<marker id="arrowOpt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#A9B4BE"/>
</marker>
<style>text { font-family: PingFang SC, Hiragino Sans GB, Heiti SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif; }</style>
</defs>
<rect width="1700" height="830" fill="#FFFFFF"/>
<text x="48" y="58" font-size="30" fill="#12314F" text-anchor="start" font-weight="700">图 1-2　单模态 2D 感知系统数据流与连接图</text>
<text x="48" y="88" font-size="13" fill="#5B6B7A" text-anchor="start" font-weight="400">实线为必需数据边 E01–E10；浅色虚线为可选输入。模块之间只传结构化结果。</text>
<rect x="40" y="372" width="150" height="105" rx="12" fill="#F4F6F8" stroke="#8A97A3" stroke-width="1.8"/>
<text x="56" y="404" font-size="14" fill="#4A5A6A" text-anchor="start" font-weight="700">输入源</text>
<text x="56" y="430" font-size="11" fill="#5B6B7A" text-anchor="start" font-weight="400">· 道路 RGB 图像与视频</text>
<text x="56" y="450" font-size="11" fill="#5B6B7A" text-anchor="start" font-weight="400">· 相机参数（可选）</text>
<rect x="225" y="352" width="200" height="145" rx="12" fill="#EDF3FA" stroke="#2F6FB0" stroke-width="1.8"/>
<rect x="241" y="366" width="46" height="22" rx="11" fill="#2F6FB0"/>
<text x="264" y="381" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">M1</text>
<text x="241" y="414" font-size="15" fill="#2F6FB0" text-anchor="start" font-weight="700">输入接入与标定状态管理</text>
<text x="241" y="438" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">出：CalibratedFrame（I2）</text>
<text x="241" y="457" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">出：DatasetManifest（I1）</text>
<text x="241" y="476" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">E03（全链路，带外）</text>
<rect x="495" y="352" width="200" height="145" rx="12" fill="#EDF3FA" stroke="#2F6FB0" stroke-width="1.8"/>
<rect x="511" y="366" width="46" height="22" rx="11" fill="#2F6FB0"/>
<text x="534" y="381" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">M2</text>
<text x="511" y="414" font-size="15" fill="#2F6FB0" text-anchor="start" font-weight="700">输入规范化与质量评价</text>
<text x="511" y="438" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">入：CalibratedFrame</text>
<text x="511" y="457" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">出：ImageVariantSet（I3）</text>
<text x="511" y="476" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">出：QualityReport</text>
<rect x="800" y="120" width="215" height="120" rx="12" fill="#EDF3FA" stroke="#2F6FB0" stroke-width="1.8"/>
<rect x="816" y="134" width="46" height="22" rx="11" fill="#2F6FB0"/>
<text x="839" y="149" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">M3</text>
<text x="816" y="182" font-size="15" fill="#2F6FB0" text-anchor="start" font-weight="700">帧间几何估计</text>
<text x="816" y="206" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">图像对：估计图像平面变换</text>
<text x="816" y="225" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">出：MatchResult（I4，可选）</text>
<rect x="800" y="330" width="215" height="260" rx="12" fill="#EDF3FA" stroke="#2F6FB0" stroke-width="1.8"/>
<rect x="816" y="344" width="46" height="22" rx="11" fill="#2F6FB0"/>
<text x="839" y="359" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">M4</text>
<text x="816" y="392" font-size="15" fill="#2F6FB0" text-anchor="start" font-weight="700">多目标检测与跟踪</text>
<rect x="816" y="406" width="183" height="58" rx="8" fill="#F4F6F8" stroke="#8A97A3" stroke-width="1.2"/>
<text x="826" y="428" font-size="12" fill="#4A5A6A" text-anchor="start" font-weight="700">检测子块</text>
<text x="826" y="447" font-size="11" fill="#5B6B7A" text-anchor="start" font-weight="400">出：DetectionSet（I5）</text>
<rect x="816" y="486" width="183" height="58" rx="8" fill="#F4F6F8" stroke="#8A97A3" stroke-width="1.2"/>
<text x="826" y="508" font-size="12" fill="#4A5A6A" text-anchor="start" font-weight="700">跟踪子块</text>
<text x="826" y="527" font-size="11" fill="#5B6B7A" text-anchor="start" font-weight="400">出：TrackSet（I6）</text>
<text x="816" y="570" font-size="10.5" fill="#A9B4BE" text-anchor="start" font-weight="400">可选入：MatchResult（运动补偿）</text>
<rect x="800" y="620" width="215" height="105" rx="12" fill="#EDF3FA" stroke="#2F6FB0" stroke-width="1.8"/>
<rect x="816" y="634" width="46" height="22" rx="11" fill="#2F6FB0"/>
<text x="839" y="649" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">M5</text>
<text x="816" y="682" font-size="15" fill="#2F6FB0" text-anchor="start" font-weight="700">语义分割</text>
<text x="816" y="706" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">出：SegmentationMap（I7）</text>
<rect x="1150" y="350" width="215" height="170" rx="12" fill="#EFEAF7" stroke="#6B5BA8" stroke-width="1.8"/>
<rect x="1166" y="364" width="46" height="22" rx="11" fill="#6B5BA8"/>
<text x="1189" y="379" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="700">M6</text>
<text x="1166" y="412" font-size="15" fill="#6B5BA8" text-anchor="start" font-weight="700">2D 场景结构融合</text>
<text x="1166" y="436" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">入：TrackSet、SegmentationMap</text>
<text x="1166" y="455" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">入：MatchResult（可选）</text>
<text x="1166" y="474" font-size="11.5" fill="#5B6B7A" text-anchor="start" font-weight="400">出：SceneGraph2D（I8）</text>
<rect x="1420" y="385" width="200" height="120" rx="12" fill="#F4F6F8" stroke="#8A97A3" stroke-width="1.8"/>
<text x="1436" y="417" font-size="14" fill="#2F6FB0" text-anchor="start" font-weight="700">结构化场景描述</text>
<text x="1436" y="443" font-size="11" fill="#5B6B7A" text-anchor="start" font-weight="400">· 唯一对外契约 SceneGraph2D</text>
<text x="1436" y="463" font-size="11" fill="#5B6B7A" text-anchor="start" font-weight="400">· 节点 / 关系 / 证据 / 置信度</text>
<path d="M 190 420 L 225 420" fill="none" stroke="#7A8B99" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="194" y="412" font-size="11" fill="#5B6B7A" text-anchor="start" font-weight="400">E01</text>
<path d="M 425 420 L 495 420" fill="none" stroke="#7A8B99" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="460" y="445" font-size="11" fill="#5B6B7A" text-anchor="middle" font-weight="400">E02 · I2</text>
<path d="M 695 395 L 740 395 L 740 180 L 800 180" fill="none" stroke="#7A8B99" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="748" y="170" font-size="11" fill="#5B6B7A" text-anchor="middle" font-weight="400">E04　图像对</text>
<path d="M 695 420 L 800 420" fill="none" stroke="#7A8B99" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="748" y="412" font-size="11" fill="#5B6B7A" text-anchor="middle" font-weight="400">E05　连续帧</text>
<path d="M 695 445 L 740 445 L 740 672 L 800 672" fill="none" stroke="#7A8B99" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="748" y="662" font-size="11" fill="#5B6B7A" text-anchor="middle" font-weight="400">E06　单帧</text>
<path d="M 901 464 L 901 486" fill="none" stroke="#7A8B99" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="910" y="480" font-size="11" fill="#5B6B7A" text-anchor="start" font-weight="400">E07</text>
<path d="M 1015 515 L 1150 515" fill="none" stroke="#7A8B99" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1022" y="507" font-size="11" fill="#5B6B7A" text-anchor="start" font-weight="400">E08 · TrackSet</text>
<path d="M 1015 672 L 1085 672 L 1085 535 L 1150 535" fill="none" stroke="#7A8B99" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1030" y="700" font-size="11" fill="#5B6B7A" text-anchor="start" font-weight="400">E09 · SegmentationMap（I7）</text>
<path d="M 1365 445 L 1420 445" fill="none" stroke="#7A8B99" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1370" y="437" font-size="11" fill="#5B6B7A" text-anchor="start" font-weight="400">E10</text>
<path d="M 1015 180 L 1080 180 L 1080 400 L 1150 400" fill="none" stroke="#A9B4BE" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowOpt)"/>
<text x="1075" y="300" font-size="11" fill="#A9B4BE" text-anchor="end" font-weight="400">MatchResult（可选）</text>
</svg>
